<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="坏KiKi的小鱼缸：三十多种外形各异的鱼，点一下水面撒鱼食，还可以放一条鱼进来。小心偶尔闯进的坏KiKi！" />
    <meta name="theme-color" content="#1a8db0" />
    <title>坏KiKi的小鱼缸</title>
    <script type="module" crossorigin src="/assets/index.vite-JFtFuTt0.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-4nL6WBw4.css">
  </head>
  <body>
    <main class="tank">
      <canvas
        id="tank"
        role="img"
        aria-label="一个动画鱼缸：最多 100 条鱼。点击水面撒鱼食；可用钻石升级哥斯拉、购买辣子鸡封印坏KiKi，或开启大宝藏。"
      ></canvas>

      <div class="controls">
        <div id="dongying-medal" class="dongying-medal" hidden title="东营认可">
          <span class="medal-disc" aria-hidden="true"></span>
          <span class="medal-text">东营认可</span>
        </div>
        <button id="add-fish" class="btn btn-primary" type="button">放一条鱼</button>
      </div>

      <aside class="resources" aria-label="资源">
        <div class="diamond-bank" aria-live="polite">
          <span class="gem" aria-hidden="true"></span>
          <span id="diamond-count">0</span>
        </div>
        <p id="godzilla-status" class="godzilla-status" hidden>Lv.1 · 可驱赶 1 次</p>
        <button id="kaiju-action" class="btn btn-kaiju" type="button" disabled>
          购买哥斯拉 · 10
        </button>
        <button id="food-upgrade" class="btn btn-food" type="button" disabled>
          升级鱼食 · 20
        </button>
        <button id="laziji-buy" class="btn btn-laziji" type="button" disabled>
          购买辣子鸡 · 100
        </button>
        <button id="treasure-buy" class="btn btn-treasure" type="button" disabled>
          大宝藏 · 1000
        </button>
      </aside>

      <div id="treasure-modal" class="treasure-modal" hidden>
        <div class="treasure-card" role="dialog" aria-modal="true" aria-labelledby="treasure-title">
          <div id="treasure-chest" class="chest" aria-hidden="true">
            <div class="chest-lid"></div>
            <div class="chest-body"></div>
            <div class="chest-glow"></div>
          </div>
          <div id="treasure-medal-reveal" class="treasure-medal-reveal">
            <div class="reveal-disc" aria-hidden="true"></div>
            <p id="treasure-title">东营认可</p>
          </div>
          <button id="treasure-confirm" class="btn btn-primary" type="button">确认</button>
        </div>
      </div>
    </main>
  </body>
</html>
