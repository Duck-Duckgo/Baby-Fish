<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="坏KiKi的小鱼缸：25 种外形各异的鱼，点一下水面撒鱼食，还可以放一条鱼进来。小心偶尔闯进的坏KiKi！" />
    <meta name="theme-color" content="#1a8db0" />
    <title>坏KiKi的小鱼缸</title>
  </head>
  <body>
    <main class="tank">
      <canvas
        id="tank"
        role="img"
        aria-label="一个动画鱼缸：25 种外形各异的鱼在水草和气泡之间游动，海底有卡通小镇角色与建筑。点击水里任意位置可以撒鱼食。"
      ></canvas>

      <div class="controls">
        <button id="add-fish" class="btn btn-primary" type="button">放一条鱼</button>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
